version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    groups:
      # Storybook add-ons declare a peer dependency on the matching `storybook`
      # release, so they have to move together. Bump them in a single PR.
      storybook:
        patterns:
          - 'storybook'
          - '@storybook/*'
          - '@chromatic-com/storybook'
          - 'eslint-plugin-storybook'
        update-types:
          - 'minor'
          - 'patch'
    ignore:
      # A Storybook major upgrade has to be done by hand as one coordinated
      # migration (e.g. @storybook/addon-vitest 10 requires vitest 4+), so don't
      # open per-package major-bump PRs, which break the Storybook build.
      - dependency-name: 'storybook'
        update-types: ['version-update:semver-major']
      - dependency-name: '@storybook/*'
        update-types: ['version-update:semver-major']
      - dependency-name: '@chromatic-com/storybook'
        update-types: ['version-update:semver-major']
      - dependency-name: 'eslint-plugin-storybook'
        update-types: ['version-update:semver-major']
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
  - package-ecosystem: 'pip'
    directory: '/docs'
    schedule:
      interval: 'weekly'
    groups:
      # The docs toolchain (MkDocs, its theme and plugins, pdoc, Pygments) is
      # built and verified as a whole, so bump it in a single PR.
      docs:
        patterns:
          - '*'
    ignore:
      # MkDocs 2.0 removes the plugin and theme systems that Material for
      # MkDocs and our plugins depend on, so a major bump can't be taken as-is.
      - dependency-name: 'mkdocs'
        update-types: ['version-update:semver-major']
      # mkdocs-material 9.8+ requires Python >= 3.11, but Read the Docs builds
      # with Python 3.10 (.readthedocs.yaml). Drop this once that is raised.
      - dependency-name: 'mkdocs-material'
        versions: ['>=9.8']
      # pdoc renders the API reference through a custom template
      # (pdoc/templates/), and the docs-build CI job doesn't run it, so a major
      # bump would land untested. Upgrade pdoc majors by hand with
      # `make api-docs`.
      - dependency-name: 'pdoc'
        update-types: ['version-update:semver-major']
