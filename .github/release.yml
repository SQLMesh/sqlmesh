# Groups the notes that GitHub generates for each release (see
# `generate_release_notes` in workflows/release.yaml) by PR label.
# Labels are applied automatically by workflows/pr-labels.yaml. `Feature`, `Bug`
# and `Documentation` are the repo's existing labels, so keep their capitalization.
# A PR is listed under the first category whose labels it matches.
# .github/RELEASING.md refers to these section titles, so keep the two in sync.
changelog:
  exclude:
    labels:
      - skip-changelog
      - ci
      - test
      - dependencies
  categories:
    - title: Breaking changes
      labels:
        - breaking-change
    - title: State migrations (run `sqlmesh migrate` after upgrading)
      labels:
        - migration
    - title: Features
      labels:
        - Feature
    - title: Performance
      labels:
        - performance
    - title: Bug fixes
      labels:
        - Bug
    - title: Documentation
      labels:
        - Documentation
    - title: Maintenance
      labels:
        - maintenance
    - title: Other changes
      labels:
        - "*"
