# Path-based PR labels, applied by workflows/pr-labels.yaml.

migration:
  - changed-files:
      - added-files: 'sqlmesh/migrations/v*.py'

dbt:
  - changed-files:
      - any-glob-to-any-file: ['sqlmesh/dbt/**', 'sqlmesh_dbt/**']

vscode:
  - changed-files:
      - any-glob-to-any-file: ['vscode/**', 'sqlmesh/lsp/**']

web-ui:
  - changed-files:
      - any-glob-to-any-file: ['web/**']

cicd-bot:
  - changed-files:
      - any-glob-to-any-file: ['sqlmesh/integrations/github/**', 'sqlmesh/cicd/**']

