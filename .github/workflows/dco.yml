name: Sanity check
on: [pull_request]

# Pin Ubuntu 24.04. ubuntu-latest now resolves to 26.04.
jobs:
  commits_check_job:
    runs-on: ubuntu-24.04
    name: Commits Check
    steps:
      - name: Get PR Commits
        id: 'get-pr-commits'
        uses: tim-actions/get-pr-commits@master
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: DCO Check
        uses: tim-actions/dco@master
        with:
          commits: ${{ steps.get-pr-commits.outputs.commits }}
