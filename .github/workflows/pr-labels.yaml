name: PR Labels
# Checks the PR title format and applies the labels that .github/release.yml
# uses to group release notes.
#
# pull_request_target is used so that labels can be applied to PRs from forks.
# This workflow never checks out or runs code from the PR.
on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: pr-labels-${{ github.event.pull_request.number }}
  # Queue rather than cancel, so a run is never stopped part-way through
  # changing labels.
  cancel-in-progress: false

jobs:
  title:
    name: Check title and label by type
    # Runs on pushes too: GitHub keeps only one pending run per concurrency
    # group, so a push can replace a queued run for a title edit.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v8
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        with:
          script: |
            const title = process.env.PR_TITLE;
            const issue_number = context.payload.pull_request.number;
            const { owner, repo } = context.repo;

            const typeLabels = new Map([
              ['feat', 'feature'],
              ['fix', 'bug'],
              ['perf', 'performance'],
              ['docs', 'documentation'],
              ['refactor', 'maintenance'],
              ['chore', 'maintenance'],
              ['build', 'maintenance'],
              ['revert', null],
              ['ci', 'ci'],
              ['test', 'test'],
            ]);
            // Scopes for internal-only work, which release notes leave out
            // (e.g. "fix(ci): ..." is labelled ci, not bug).
            const scopeLabels = new Map([['ci', 'ci'], ['test', 'test'], ['tests', 'test']]);
            // Labels this job owns. The title is the source of truth for them:
            // any that don't match the current title are removed.
            const colors = new Map([
              ['breaking-change', 'b60205'],
              ['feature', '0e8a16'],
              ['bug', 'd73a4a'],
              ['performance', 'fbca04'],
              ['documentation', '0075ca'],
              ['maintenance', 'c5def5'],
              ['ci', 'ededed'],
              ['test', 'ededed'],
            ]);

            let wanted;
            if (/^Revert "/.test(title)) {
              // Title generated by GitHub's "Revert" button.
              wanted = new Set();
            } else {
              const m = /^([a-z]+)(?:\(([^)]+)\))?(!)?: \S/.exec(title);
              if (!m || !typeLabels.has(m[1])) {
                core.setFailed(
                  `PR title "${title}" must look like "type(scope): description" or ` +
                  `"type: description", where type is lowercase and one of: ` +
                  `${[...typeLabels.keys()].join(', ')}. Add "!" after the type or scope ` +
                  `for a breaking change, e.g. "feat(plan)!: ...". See CONTRIBUTING.md. ` +
                  `Re-running this job checks the old title again: edit the title instead.`
                );
                return;
              }
              const [, type, scope, bang] = m;
              wanted = new Set();
              if (bang) {
                // Breaking changes always appear in the release notes, so they
                // never get the ci/test labels that exclude a PR.
                wanted.add('breaking-change');
                const label = typeLabels.get(type);
                if (label && label !== 'ci' && label !== 'test') wanted.add(label);
              } else {
                const label = (scope && scopeLabels.get(scope.toLowerCase())) || typeLabels.get(type);
                if (label) wanted.add(label);
              }
            }

            const { data: live } = await github.rest.issues.listLabelsOnIssue({
              owner, repo, issue_number, per_page: 100,
            });
            const current = live.map((l) => l.name);

            for (const name of current) {
              if (!colors.has(name) || wanted.has(name)) continue;
              try {
                await github.rest.issues.removeLabel({ owner, repo, issue_number, name });
              } catch (e) {
                if (e.status !== 404) throw e;
              }
            }

            const toAdd = [...wanted].filter((name) => !current.includes(name));
            for (const name of toAdd) {
              try {
                await github.rest.issues.getLabel({ owner, repo, name });
              } catch (e) {
                if (e.status !== 404) throw e;
                await github.rest.issues.createLabel({ owner, repo, name, color: colors.get(name) });
              }
            }
            if (toAdd.length) {
              await github.rest.issues.addLabels({ owner, repo, issue_number, labels: toAdd });
            }

  migrations:
    name: Label new state migrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v8
        with:
          script: |
            const issue_number = context.payload.pull_request.number;
            const { owner, repo } = context.repo;
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner, repo, pull_number: issue_number, per_page: 100,
            });
            const added = files.some(
              (f) => f.status === 'added' && /^sqlmesh\/migrations\/v\d+_.*\.py$/.test(f.filename)
            );
            const labels = context.payload.pull_request.labels.map((l) => l.name);
            if (!added) {
              // The PR no longer adds a migration, e.g. the file was removed.
              if (labels.includes('migration')) {
                try {
                  await github.rest.issues.removeLabel({ owner, repo, issue_number, name: 'migration' });
                } catch (e) {
                  if (e.status !== 404) throw e;
                }
              }
              return;
            }
            if (labels.includes('migration')) return;
            try {
              await github.rest.issues.getLabel({ owner, repo, name: 'migration' });
            } catch (e) {
              if (e.status !== 404) throw e;
              await github.rest.issues.createLabel({ owner, repo, name: 'migration', color: '5319e7' });
            }
            await github.rest.issues.addLabels({ owner, repo, issue_number, labels: ['migration'] });
