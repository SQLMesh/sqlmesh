services:
  minio:
    image: cgr.dev/chainguard/minio@sha256:039800e64ec7247d2fde7cff3697e964f6fe20b6d7d2c46aa7d82cc63355d512
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: localpwd

  minio-init:
    image: cgr.dev/chainguard/minio-client:latest-dev@sha256:fb635b967f5f32424391150dac4985cc1aea78fb0a1ce031c01952cf661a13ec
    depends_on:
      minio:
        condition: service_started
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: localpwd
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        attempt=0
        until mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" >/dev/null 2>&1 && mc ready local >/dev/null 2>&1; do
          attempt=$$((attempt + 1))
          if [ "$$attempt" -ge 30 ]; then
            echo 'MinIO did not become ready after 30 attempts' >&2
            exit 1
          fi
          sleep 1
        done
        mc mb --ignore-existing local/warehouse-rest
        exec sleep infinity
    healthcheck:
      test: ["CMD-SHELL", "mc ls local/warehouse-rest >/dev/null"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 1s

  rest:
    image: tabulario/iceberg-rest:1.6.0@sha256:3b7d31bdfec626b68e97531c9778a1b9119659e456fe28545a49f6aa6a9ce472
    depends_on:
      minio-init:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: minio
      AWS_SECRET_ACCESS_KEY: localpwd
      AWS_REGION: us-east-1
      CATALOG_WAREHOUSE: s3://warehouse-rest/
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://minio:9000
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/8181"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 15s

  clickhouse:
    image: clickhouse/clickhouse-server:25.8.16.34@sha256:86e6acceeacb49202fd694b77b4f7fcd6e022b52a29b0568fbfb4b05e8f6b2e7
    depends_on:
      rest:
        condition: service_healthy
      minio-init:
        condition: service_healthy
    environment:
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: clickhouse
      CLICKHOUSE_DB: default
    ports:
      - "127.0.0.1:18123:8123"
    healthcheck:
      test:
        [
          "CMD",
          "clickhouse-client",
          "--user",
          "clickhouse",
          "--password",
          "clickhouse",
          "--query",
          "SELECT 1",
        ]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 15s

  seed:
    build:
      context: ./clickhouse-datalake
      dockerfile: Dockerfile
    depends_on:
      rest:
        condition: service_healthy
      minio-init:
        condition: service_healthy
    environment:
      ICEBERG_REST_URL: http://rest:8181
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY_ID: minio
      S3_SECRET_ACCESS_KEY: localpwd
