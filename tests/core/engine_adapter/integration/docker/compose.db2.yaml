services:
  db2:
    image: icr.io/db2_community/db2:latest
    container_name: db2
    # IBM Db2 Community Edition — accepting the license is required to start the container.
    # This is standard for IBM community images; it does not require an IBM account
    # and carries no cost for development/test use.
    environment:
      - LICENSE=accept
      - DB2INST1_PASSWORD=db2inst1
      - DBNAME=TESTDB
      - ARCHIVE_LOGS=false
      - AUTOCONFIG=false
    ports:
      - 50001:50000
    privileged: true   # Db2 requires elevated privileges to set kernel parameters
    healthcheck:
      test: ["CMD", "su", "-", "db2inst1", "-c", "db2 connect to TESTDB"]
      interval: 30s
      timeout: 20s
      retries: 10
      start_period: 120s
